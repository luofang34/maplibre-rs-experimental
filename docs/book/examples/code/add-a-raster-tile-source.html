<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add a Raster Tile Source</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0e14;
        }
        #maplibre {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="maplibre"></canvas>
    <script type="module">
        import { startMapLibre } from 'maplibre-rs';

        async function style() {
            return {
                'version': 8,
                'sources': {
                    'raster-tiles': {
                        'type': 'raster',
                        'tiles': ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                        'tileSize': 256,
                        'minzoom': 0,
                        'maxzoom': 19,
                        'attribution': '© OpenStreetMap contributors',
                    }
                },
                'layers': [
                    {
                        'id': 'simple-tiles',
                        'type': 'raster',
                        'source': 'raster-tiles',
                    }
                ],
                'id': 'blank',
                'projection': {
                    'type': 'globe'
                },
                'center': [0, 0], // starting position
                'zoom': 0 // starting zoom
            };
        }

        startMapLibre(undefined, undefined, JSON.stringify(await style()));
    </script>
</body>
</html>
