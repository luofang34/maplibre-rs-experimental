<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create a Gradient Line</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0e14;
        }
        #maplibre {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="maplibre"></canvas>
    <script type="module">
        import { startMapLibre } from 'maplibre-rs';

        async function style() {
            const style = await (await fetch('https://tiles.openfreemap.org/styles/bright')).json();
            style.projection = { type: 'globe' };
            style.center = [-77.035, 38.875];
            style.zoom = 12;

            style.sources['line'] = {
                type: 'geojson',
                data: {
                    type: 'FeatureCollection',
                    features: [
                        {
                            type: 'Feature',
                            properties: {},
                            geometry: {
                                type: 'LineString',
                                coordinates: [
                                    [-77.044211, 38.852924],
                                    [-77.045659, 38.860158],
                                    [-77.044232, 38.862326],
                                    [-77.040879, 38.865454],
                                    [-77.039936, 38.867698],
                                    [-77.040338, 38.86943],
                                    [-77.04264, 38.872528],
                                    [-77.03696, 38.878424],
                                    [-77.032309, 38.87937],
                                    [-77.030056, 38.880945],
                                    [-77.027645, 38.881779],
                                    [-77.026946, 38.882645],
                                    [-77.026942, 38.885502],
                                    [-77.028054, 38.887449],
                                    [-77.02806, 38.892088],
                                    [-77.03364, 38.892108],
                                    [-77.033643, 38.899926]
                                ]
                            }
                        }
                    ]
                }
            };

            style.layers.push({
                id: 'line',
                type: 'line',
                source: 'line',
                layout: {
                    'line-cap': 'round',
                    'line-join': 'round'
                },
                paint: {
                    'line-width': 12,
                    'line-gradient': [
                        'interpolate',
                        ['linear'],
                        ['line-progress'],
                        0, 'blue',
                        0.1, 'royalblue',
                        0.3, 'cyan',
                        0.5, 'lime',
                        0.7, 'yellow',
                        1, 'red'
                    ]
                }
            });

            return style;
        }

        startMapLibre(undefined, undefined, JSON.stringify(await style()));
    </script>
</body>
</html>
