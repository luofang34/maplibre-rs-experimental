<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display a Globe with an Atmosphere</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0e14;
        }
        #maplibre {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="maplibre"></canvas>
    <script type="module">
        import { startMapLibre } from 'maplibre-rs';

        async function style() {
            return {
                'version': 8,
                'projection': {
                    'type': 'globe'
                },
                'sources': {
                    'satellite': {
                        'tiles': ['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'],
                        'type': 'raster'
                    },
                },
                'layers': [
                    {
                        'id': 'Satellite',
                        'type': 'raster',
                        'source': 'satellite',
                    },
                ],
                'sky': {
                    'atmosphere-blend': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        0, 1,
                        5, 1,
                        7, 0
                    ]
                },
                'light': {
                    'anchor': 'map',
                    'position': [1.5, 90, 80]
                },
                'center': [137.9150899566626, 36.25956997955441],
                'zoom': 0
            };
        }

        startMapLibre(undefined, undefined, JSON.stringify(await style()));
    </script>
</body>
</html>
