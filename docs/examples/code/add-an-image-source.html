<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add an Image Source</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0e14;
        }
        #maplibre {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="maplibre"></canvas>
    <script type="module">
        import { startMapLibre } from 'maplibre-rs';

        async function style() {
            const style = await (await fetch('https://tiles.openfreemap.org/styles/bright')).json();
            style.projection = { type: 'globe' };
            style.center = [-75.789, 41.874];
            style.zoom = 5;

            style.sources['radar'] = {
                type: 'image',
                url: 'https://maplibre.org/maplibre-gl-js/docs/assets/radar.gif',
                coordinates: [
                    [-80.425, 46.437],
                    [-71.516, 46.437],
                    [-71.516, 37.936],
                    [-80.425, 37.936]
                ]
            };

            style.layers.push({
                id: 'radar-layer',
                type: 'raster',
                source: 'radar',
                paint: {
                    'raster-opacity': 0.85,
                    'raster-fade-duration': 0
                }
            });

            return style;
        }

        startMapLibre(undefined, undefined, JSON.stringify(await style()));
    </script>
</body>
</html>
