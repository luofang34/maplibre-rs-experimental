<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Live Realtime Data</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0e14;
        }
        #maplibre {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="maplibre"></canvas>
    <script type="module">
        import { startMapLibre } from 'maplibre-rs';

        async function style() {
            const style = await (await fetch('https://tiles.openfreemap.org/styles/bright')).json();
            style.center = [0, 0];
            style.zoom = 2;

            style.sources['iss'] = {
                'type': 'geojson',
                'data': {'type': 'FeatureCollection', 'features': []}
            };
            style.layers.push({
                'id': 'iss',
                'type': 'circle',
                'source': 'iss',
                'paint': {
                    'circle-radius': 8,
                    'circle-color': '#e55e5e'
                }
            });
            return style;
        }

        function run(map) {
            const update = async () => {
                // Where the International Space Station is now.
                const response = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
                const {longitude, latitude} = await response.json();
                await map.setGeoJsonData('iss', {
                    'type': 'Feature',
                    'properties': {},
                    'geometry': {'type': 'Point', 'coordinates': [longitude, latitude]}
                });
                await map.easeTo({center: [longitude, latitude], duration: 1000});
            };
            const tick = () => update().catch((error) => console.error(error)).finally(() => setTimeout(tick, 2000));
            tick();
        }

        const map = await startMapLibre(undefined, undefined, JSON.stringify(await style()));
        if (map) {
            run(map);
        }
    </script>
</body>
</html>
