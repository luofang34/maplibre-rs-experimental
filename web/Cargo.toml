[package]
name = "web"
version = "0.1.0"
publish = false

description.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[features]
renderer = ["dep:wgpu"]
winit-window = ["renderer", "dep:maplibre-winit"]
webgpu = ["renderer", "maplibre/webgpu", "wgpu?/webgpu", "wgpu?/wgsl"]
web-webgl = ["renderer", "maplibre/web-webgl", "wgpu?/webgl", "wgpu?/wgsl"]
trace = ["maplibre/trace", "tracing-wasm"]
font-shaping = ["maplibre/font-shaping"]
mlt = ["maplibre/mlt"]
arena-telemetry = []
default = ["renderer", "winit-window", "webgpu"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tracing.workspace = true
async-trait.workspace = true
maplibre = { path = "../maplibre", default-features = false, features = ["raster", "geojson"] }
maplibre-winit = { path = "../maplibre-winit", version = "0.1.0", optional = true }

getrandom = { version = "0.4.3", features = ["wasm_js"] }

log.workspace = true

thiserror.workspace = true

console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Worker", "WorkerGlobalScope", "DedicatedWorkerGlobalScope", "MessageEvent",
    "MessageChannel", "MessagePort", "OffscreenCanvas",
    "Request", "RequestInit", "RequestMode", "Response", "Headers",
    "ErrorEvent"
] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
futures.workspace = true
instant.workspace = true
wgpu = { version = "30.0.1", default-features = false, optional = true, features = ["std"] }
console_log.workspace = true
tracing-wasm = { workspace = true, optional = true } # TODO: Low quality dependency (remove in a separate PR!)
# For passing Inputs in AsyncProcedureCalls
serde_json.workspace = true
serde.workspace = true
cgmath.workspace = true
bytemuck.workspace = true
rustc-hash.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing = { version = "0.1.37", features = ["release_max_level_off"] }

[dev-dependencies]
image.workspace = true
winit.workspace = true
wasm-bindgen-test.workspace = true
wgpu.workspace = true
