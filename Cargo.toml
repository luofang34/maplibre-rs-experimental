[workspace]

resolver = "2"

members = [
    "maplibre",
    "maplibre-winit",
    "maplibre-build-tools",
    "maplibre-demo",
    "android",
    "apple",
    "web",
    "benchmarks",
    "render-tests",
]

[workspace.package]
description = "Maps for Desktop, Mobile and Web"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later AND (MIT OR Apache-2.0)"
keywords = ["graphics", "maps", "webgl", "tiles"]
categories = ["graphics", "science::geo"]
authors = ["MapLibre"]

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(no_pendantic_os_check)'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
collapsible_if = "allow"

[workspace.dependencies]
rand = { version = "0.10.3" }
reqwest-middleware = "0.4.2"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
async-trait = "0.1.73"
futures = { version = "0.3", default-features = false, features = ["std"] }
bytemuck = "1.14.0"
bytemuck_derive = "1.5.0"
cgmath = "0.18.0"
cint = "0.3.1"
clap = { version = "4.3.24", features = ["derive"] }
console_error_panic_hook = "0.1.7"
console_log = { version = "1.0.0", features = ["color"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }
csscolorparser = { version = "0.9.0", features = ["serde", "cint"] }
downcast-rs = "2.0.2"
earcut = "0.4"
env_logger = "0.11.3"
flatbuffers = "25.12.19"
flatc-rust = "0.2.0"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
geo = "0.33.1"
geo-types = { version = "0.7.20", features = ["rstar_0_12"] }
geozero = { version = "0.15.1", default-features = false, features = ["with-mvt", "with-geo"] }
image = { version = "0.25.2", default-features = false, features = ["jpeg", "webp", "png", "gif"] }
include_dir = "0.7.3"
instant = { version = "0.1.12", features = ["wasm-bindgen"] }  # TODO: Untrusted dependency
jni = "0.22.4"
js-sys = "0.3"
log = "0.4.20"
lyon = { version = "1.0.1", features = [] }
unicode-normalization = { version = "0.1.24", default-features = false }
# Keep this dependency compatible with the workspace MSRV.
mlt-core = "=0.22.1"
naga = { version = "30.0.1", features = ["wgsl-in"] }
android_logger = "0.15.1"
png = { version = "0.18.1" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "gzip"] }  # Use rusttls on android because cross compiling is difficult
rstar = "0.12.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.188", features = ["derive", "rc"] }
serde_json = "1.0.107"
smallvec = "1.11.1"
thiserror = "2.0.21"
tile-grid = "0.6.1"
tokio = "1.32.0"  # Individual features are customized in each crate
tokio-util = { version = "0.7.9", features = ["rt"] }
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
tracing-tracy = "=0.12.0"
tracing-wasm = "0.2.1"  # TODO: Low quality dependency (remove in a separate PR!)
walkdir = "2.4.0"
wasm-bindgen = "=0.2.130" # Also change in flake.nix and CI scripts
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = "0.3"  # Individual features are customized in each crate
wgpu = { version = "30.0.1", features = ["trace"] }
http-cache-reqwest = "0.16.0"
rustc-hash = "2.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 's'
panic = "abort"
strip = "debuginfo"

[profile.bench]
debug = true

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.test.package.zlib-rs]
opt-level = 3
