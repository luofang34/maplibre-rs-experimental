[package]
name = "maplibre"
version = "0.1.0"
build = "build.rs"
readme = "../README.md"

description.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[features]
# FIXME tcs: Remove raster from default
default = ["raster", "mlt"]
web-webgl = ["wgpu/webgl"]
# Enable tracing using tracy on desktop/mobile and the chrome profiler on web
trace = ["tracing-subscriber", "tracing-tracy"]
thread-safe-futures = []
embed-static-tiles = ["maplibre-build-tools/sqlite"]
headless = ["png"]
raster = ["image", "moxcms"]
geojson = []
# Reads MapLibre Tile (MLT) vector tiles. Its encoder dependencies reach `getrandom` 0.1,
# which has no visionOS support, so a visionOS build turns it off.
mlt = ["dep:mlt-core"]


[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "visionos", target_os = "linux", target_os = "android", target_os = "windows"))'.dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
env_logger.workspace = true
reqwest.workspace = true
http-cache-reqwest.workspace = true
reqwest-middleware.workspace = true
tracing-tracy = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Request", "RequestInit", "Response", "Headers", "Window", "WorkerGlobalScope"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest.workspace = true

[dependencies]
unicode-bidi = "0.3"
async-trait.workspace = true
futures.workspace = true
flate2.workspace = true
instant.workspace = true

# Tracing
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

# Maths
cgmath.workspace = true

# Geo
geo.workspace = true
geo-types.workspace = true
rstar.workspace = true
geozero = { workspace = true, features = ["with-geojson"] }
tile-grid.workspace = true
mlt-core = { workspace = true, optional = true }
unicode-normalization.workspace = true

# Rendering
wgpu.workspace = true
#wgpu = { git = "https://github.com/gfx-rs/wgpu.git", rev = "" }
lyon.workspace = true

# cached = "0.32"

# Logging
log.workspace = true

# Utils
bytemuck.workspace = true
bytemuck_derive.workspace = true
thiserror.workspace = true

# Static tiles inclusion
include_dir.workspace = true

# JSON
serde.workspace = true
serde_json.workspace = true

# Colors
csscolorparser.workspace = true
cint.workspace = true

# Required by bevy renderer
downcast-rs.workspace = true
smallvec.workspace = true

# Headless
png = { workspace = true, optional = true }
image = { workspace = true, optional = true }
moxcms = { version = "0.8", optional = true }

# Text/glyphs
prost = "0.13.1"

[dev-dependencies]
# Shaders stay WGSL; a native render node gets them through naga's own backends.
naga = { workspace = true, features = ["msl-out", "spv-out"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
web-sys = { workspace = true, features = ["Window"] }

[[test]]
name = "headless_symbol_render"
required-features = ["headless"]

[[test]]
name = "web_local_scheduler"
required-features = ["headless"]

[[test]]
name = "web_host_gpu_render"
required-features = ["headless", "raster"]

[build-dependencies]
maplibre-build-tools = { path = "../maplibre-build-tools", version = "0.1.0" }
prost-build = "0.13.1"
