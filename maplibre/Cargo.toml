[package]
name = "maplibre"
version = "0.1.0"
build = "build.rs"
readme = "../README.md"

description.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["native-io", "raster", "geojson", "mlt"]
# Enables the default native Tokio task scheduler and Reqwest HTTP transport.
# Disable (`default-features = false`) to embed `maplibre` in pure-Rust apps with a custom runtime/loader.
native-io = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:env_logger",
    "dep:reqwest",
    "dep:http-cache-reqwest",
    "dep:reqwest-middleware",
    "dep:rusqlite",
]
web-webgl = ["wgpu/webgl"]
# Enable tracing using tracy on desktop/mobile and the chrome profiler on web
trace = ["tracing-subscriber", "tracing-tracy"]
thread-safe-futures = []
embed-static-tiles = ["maplibre-build-tools/sqlite"]
headless = ["png"]
raster = []
geojson = ["geozero/with-geojson"]
# Reads MapLibre Tile (MLT) vector tiles. Its encoder dependencies reach `getrandom` 0.1,
# which has no visionOS support, so a visionOS build turns it off.
mlt = ["dep:mlt-core"]
experimental = []


[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "visionos", target_os = "linux", target_os = "android", target_os = "windows"))'.dependencies]
tokio = { workspace = true, optional = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
http-cache-reqwest = { workspace = true, optional = true }
reqwest-middleware = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
tracing-tracy = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdb.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Cache", "CacheStorage", "Request", "RequestCache", "RequestInit", "Response", "ResponseInit", "Headers", "Window", "WorkerGlobalScope", "WorkerLocation"] }

[dependencies]
unicode-bidi = "0.3"
async-trait.workspace = true
futures.workspace = true
flate2.workspace = true
instant.workspace = true

# Tracing
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

# Maths
cgmath.workspace = true

# Geo
geo.workspace = true
geo-types.workspace = true
rstar.workspace = true
geozero.workspace = true
tile-grid.workspace = true
mlt-core = { workspace = true, optional = true }
unicode-normalization.workspace = true

# Rendering
wgpu.workspace = true
#wgpu = { git = "https://github.com/gfx-rs/wgpu.git", rev = "" }
lyon.workspace = true
earcut.workspace = true

# cached = "0.32"

# Logging
log.workspace = true

# Utils
bytemuck.workspace = true
bytemuck_derive.workspace = true
thiserror.workspace = true

# Static tiles inclusion
include_dir.workspace = true

# JSON
serde.workspace = true
serde_json.workspace = true

# Colors
csscolorparser.workspace = true
cint.workspace = true

# Required by bevy renderer
downcast-rs.workspace = true
smallvec.workspace = true
rustc-hash.workspace = true

# Headless / Image decoding
png = { workspace = true, optional = true }
image.workspace = true
moxcms = "0.9.1"

# Text/glyphs, OpenType shaping, and locale-aware collation / number formatting
prost = "0.14.4"
fixed_decimal = { version = "0.7", features = ["ryu"] }
icu_collator = "2.4"
icu_decimal = { version = "2.4", features = ["alloc", "ryu"] }
icu_locale_core = "2.4"
harfrust.workspace = true
skrifa.workspace = true
read-fonts.workspace = true
ab_glyph_rasterizer.workspace = true
brotli-decompressor.workspace = true

[dev-dependencies]
geozero = { workspace = true, features = ["with-geojson"] }
# Shaders stay WGSL; a native render node gets them through naga's own backends.
naga = { workspace = true, features = ["msl-out", "spv-out"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
web-sys = { workspace = true, features = ["Window"] }

[[test]]
name = "headless_symbol_render"
required-features = ["headless"]

[[test]]
name = "web_local_scheduler"
required-features = ["headless"]

[[test]]
name = "web_sources"
required-features = ["headless"]

[[test]]
name = "web_host_gpu_render"
required-features = ["headless", "raster"]

[build-dependencies]
maplibre-build-tools = { path = "../maplibre-build-tools", version = "0.1.0" }
prost-build = "0.14.4"
serde_json.workspace = true
