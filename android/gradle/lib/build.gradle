plugins {
    id 'org.mozilla.rust-android-gradle.rust-android' version '0.10.0' apply true
    id 'com.android.library' version '8.9.1' apply true
    id 'org.jetbrains.kotlin.android' version '2.4.21' apply true
}

apply plugin: 'kotlin-android'

android {
    // Also update NDK in library-android.yml
    ndkVersion "27.3.13750724"

    compileSdkVersion 36
    
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36


        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'org.maplibre_rs'
}

cargo {
    module = "../../"
    // No 32-bit x86: mlt-core's fsst-rs asserts a table entry size that holds only where
    // u64 is 8-byte aligned, which i686 is not.
    targets = ["arm64", "x86_64"]
    libname = "maplibre_android"
    targetDirectory = "${module}/../target"
    profile = "debug"
    // This should be in sync with the justfile
    rustupChannel = "nightly"
    

    features {
        defaultAnd "foo", "bar"
        noDefaultBut("foo", "bar")
        all()
    }
}

dependencies {
    androidTestImplementation('com.android.support.test.espresso:espresso-core:3.0.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    testImplementation 'junit:junit:4.13.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.4.21"
}

tasks.whenTaskAdded { task ->
    if ((task.name == 'mergeDebugJniLibFolders' || task.name == 'mergeReleaseJniLibFolders')) {
        task.dependsOn 'cargoBuild'
    }
}

afterEvaluate {
    // The `cargoBuild` task isn't available until after evaluation.
    android.libraryVariants.all { variant ->
        def productFlavor = ""
        variant.productFlavors.each {
            productFlavor += "${it.name.capitalize()}"
        }
        def buildType = "${variant.buildType.name.capitalize()}"
        tasks["generate${productFlavor}${buildType}Assets"].dependsOn(tasks["cargoBuild"])
    }
}
