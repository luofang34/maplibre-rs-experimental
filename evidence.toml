# Tiered evidence configuration for maplibre-rs-experimental (`Tier 2: verify`).
schema_version = 1

[workspace]
name = "maplibre-rs-experimental"
exclude_paths = [
    "target/**",
    "docs/**",
    "apple/visionos/**",
    "web/lib/src/wasm/**",
    "web/**/dist/**",
    "web/**/node_modules/**",
    "render-tests/src/tests/**",
    "render-tests/src/templates/**",
]

[architecture]
in_scope = [
    "maplibre-build-tools",
    "maplibre-coords",
    "maplibre-tcs",
    "maplibre",
    "web-tile-worker",
    "web",
    "maplibre-winit",
    "maplibre-ffi",
    "apple",
    "maplibre-android",
    "maplibre-demo",
    "benchmarks",
    "render-tests",
]
no_out_of_scope_deps = true
require_all_crates_layered = true

[[architecture.layers]]
name = "foundation"
crates = ["maplibre-build-tools", "maplibre-coords", "maplibre-tcs"]
allow_same_layer = true

[[architecture.layers]]
name = "core"
crates = ["maplibre"]
allow_same_layer = false

[[architecture.layers]]
name = "platforms"
crates = [
    "web-tile-worker",
    "web",
    "maplibre-winit",
    "maplibre-ffi",
    "apple",
    "maplibre-android",
]
allow_same_layer = true

[[architecture.layers]]
name = "apps_and_tests"
crates = ["maplibre-demo", "benchmarks", "render-tests"]
allow_same_layer = false

