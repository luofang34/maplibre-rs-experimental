[structure]
enabled = true
max_rs_lines = 500
max_lib_rs_lines = 100
max_fn_lines = 80
require_lib_rs_doc = true
forbid_mod_rs = true
forbid_generic_filenames = ["utils.rs", "helpers.rs", "common.rs"]
forbid_stray_artifacts = true

[structure.file_size_allowlist]
"maplibre/src/projection/globe/covering.rs" = 532
"maplibre/src/style/expression/evaluate/dispatch.rs" = 509
"maplibre/src/vector/process_vector/shared_geometry.rs" = 509

[lints]
require_workspace_lints_inheritance = true
forbid_bare_allow = true
allow_in_tests = true

[comments]
forbid_rot_markers = true
forbid_excuse_comments = true
forbid_sync_and_apology_comments = true
max_consecutive_inline_comment_lines = 6
max_inline_comment_ratio = 0.15
inline_ratio_min_lines = 40
allow_in_tests = true

[[web_boundaries]]
id = "web-workers-no-dom"
from_glob = "web/lib/src/{singlethreaded,multithreaded}/**/*.{ts,js,mjs}"
forbid_import_prefixes = []
forbid_import_globs = [
    "web/lib/src/browser*",
    "web/lib/src/canvas*",
    "web/lib/src/index*",
    "web/lib/src/map*",
    "web/lib/src/offscreen-client*",
    "web/lib/src/offscreen-coalesce*",
    "web/demo/**",
    "web/xr/**",
]
reason = "Web Worker modules must stay DOM- and main-thread-free; communicate only through Worker postMessage/MessagePort channels and WASM worker bindings."

[[web_boundaries]]
id = "web-tile-worker-no-gpu"
from_glob = "web/lib/src/{singlethreaded/pool.worker.ts,multithreaded/multithreaded-pool.worker.ts}"
forbid_import_prefixes = []
forbid_import_globs = [
    "web/lib/src/webgpu-compat*",
    "web/lib/src/singlethreaded/render.worker*",
]
reason = "Tile pool workers perform CPU decoding/tessellation only and must not import WebGPU compatibility or render-worker modules."

[[web_boundaries]]
id = "web-dom-no-direct-worker-internals"
from_glob = "web/lib/src/{browser,canvas,map,offscreen-client,offscreen-coalesce}.{ts,mjs}"
forbid_import_prefixes = []
forbid_import_globs = [
    "web/lib/src/singlethreaded/**",
    "web/lib/src/multithreaded/**",
]
reason = "Main-thread DOM/client helpers must talk to workers through injected Worker handles from index.ts, never import worker bundles directly."

[[banned_patterns]]
id = "no-web-settimeout"
pattern = "\\bsetTimeout\\s*\\("
languages = ["ts", "js"]
include_globs = ["web/**"]
exclude_globs = [
    "web/lib/build.mjs",
    "web/**/dist/**",
    "web/**/node_modules/**",
    "web/lib/src/wasm/**",
]
context = "code"
allow_in_tests = true
reason = "Ban setTimeout polling/recovery workarounds in Web code; wire explicit Worker message/destroyed events or AbortSignal.timeout with structured cancellation."

[[banned_patterns]]
id = "no-web-adhoc-raf"
pattern = "\\brequestAnimationFrame\\s*\\("
languages = ["ts", "js"]
include_globs = ["web/**"]
exclude_globs = [
    "web/lib/src/offscreen-coalesce.mjs",
    "web/xr/src/main.ts",
    "web/**/dist/**",
    "web/**/node_modules/**",
    "web/lib/src/wasm/**",
]
context = "code"
allow_in_tests = true
reason = "Ban ad-hoc requestAnimationFrame retries in Web modules; drive rendering via offscreen-coalesce.mjs or the canonical XR loop in web/xr/src/main.ts."

[steering]
enabled = true
root_files = ["CLAUDE.md", "AGENTS.md"]
root_max_lines = 60
require_per_crate = false
require_scoped_test_cmd = true

[feature_map.coords_projection]
description = "Coordinate spaces, tile math, zoom bounds, Mercator/Globe/VerticalPerspective projections"
crates = ["maplibre-coords", "maplibre"]
modules = ["crates/maplibre-coords/src", "maplibre/src/projection.rs"]
verify_targets = ["maplibre-coords", "harness:proptest", "harness:native-nextest"]

[feature_map.globe_terrain]
description = "Globe subdivision, tile covering, raster-dem pipeline, height/drape uniforms"
crates = ["maplibre"]
modules = ["maplibre/src/terrain.rs", "maplibre/src/projection/globe.rs"]
verify_targets = ["maplibre", "harness:proptest", "harness:render-tests"]

[feature_map.vector_tessellation]
description = "MVT/MLT/GeoJSON decoding, polygon/extrusion/line tessellation, vector GPU buffer pools"
crates = ["maplibre"]
modules = ["maplibre/src/vector.rs", "maplibre/src/geojson.rs"]
verify_targets = ["maplibre", "harness:native-nextest"]

[feature_map.sdf_symbols]
description = "Font/WOFF2 shaping, glyph/sprite atlas packing, text/icon layout, collision placement"
crates = ["maplibre"]
modules = ["maplibre/src/sdf.rs", "maplibre/src/font.rs"]
verify_targets = ["maplibre", "harness:proptest", "harness:native-nextest"]

[feature_map.apc_io]
description = "Async Procedure Call worker channels, retry state machines, geometry index wire, HTTP loaders"
crates = ["maplibre", "web", "web-tile-worker"]
modules = ["maplibre/src/io.rs", "web/src/platform.rs"]
verify_targets = ["maplibre", "harness:proptest", "harness:wasm32-clippy"]

[feature_map.web_platform]
description = "WASM bindings, single/multi-threaded Web Workers, WebGPU/WebGL2 DOM shell, XR companion"
crates = ["web", "web-tile-worker", "maplibre-winit"]
modules = ["web", "crates/web-tile-worker"]
verify_targets = [
    "gate:wasm-web-default",
    "gate:wasm-web-webgl",
    "gate:wasm-tile-worker",
    "harness:wasm32-clippy",
    "harness:web-lib",
]

[feature_map.render_pipeline]
description = "TCS World/Schedule stages, wgpu render graph/passes, headless readback, render conformance"
crates = ["maplibre", "maplibre-tcs", "render-tests"]
modules = ["maplibre/src/render.rs", "maplibre/src/headless.rs", "crates/maplibre-tcs/src", "render-tests"]
verify_targets = ["render-tests", "harness:native-nextest", "harness:render-tests"]

[floors]
delta_ceilings = { new_library_panics = 0, new_unwraps = 0, new_dead_code_allows = 0 }

