[verify]
fail_fast = true
max_parallel = 3
artifact_manifest = "artifacts/manifest.json"

[[verify.harnesses]]
name = "wasm32-clippy"
kind = "artifact-cmd"
env = { CARGO_TARGET_DIR = "target/verify-wasm" }
command = [
    "sh",
    "-c",
    "! cargo tree -p web-tile-worker --target wasm32-unknown-unknown -e normal | grep -Eq '(^|[[:space:]])winit[[:space:]]+v' && cargo clippy --target wasm32-unknown-unknown -p web -p web-tile-worker --all-targets -- -D warnings && cargo clippy --target wasm32-unknown-unknown -p web --lib --no-default-features --features renderer,web-webgl -- -D warnings",
]
timeout_secs = 300

[[verify.harnesses]]
name = "web-lib"
kind = "artifact-cmd"
cwd = "web/lib"
command = ["sh", "-c", "npx tsc --noEmit && node --test test/*.test.mjs"]
timeout_secs = 120

[[verify.harnesses]]
name = "native-nextest"
kind = "rust-test"
command = [
    "sh",
    "-c",
    "if command -v cargo-nextest >/dev/null 2>&1; then cargo nextest run --workspace --exclude web --exclude web-tile-worker --exclude maplibre-android --no-fail-fast; else cargo test --workspace --exclude web --exclude web-tile-worker --exclude maplibre-android --no-fail-fast; fi",
]
timeout_secs = 600

[[verify.harnesses]]
name = "proptest"
kind = "proptest"
depends_on = ["native-nextest"]
packages = ["maplibre-coords", "maplibre"]
min_proptests = 16
command = [
    "cargo",
    "test",
    "--no-fail-fast",
    "-p",
    "maplibre-coords",
    "-p",
    "maplibre",
    "--lib",
    "proptests::",
]
timeout_secs = 300

[[verify.harnesses]]
name = "render-tests"
kind = "artifact-cmd"
depends_on = ["proptest"]
command = [
    "cargo",
    "run",
    "-p",
    "render-tests",
    "--",
    "--ci",
    "--filter",
    "basic-v9/z0",
    "--filter",
    "projection-globe/fill-planet-tiles",
    "--filter",
    "terrain/default",
    "--summary-json",
    "artifacts/render-summary.json",
    "--lifecycle-json",
    "artifacts/camera-tile-lifecycle.json",
    "--artifact-dir",
    "artifacts/render",
]
timeout_secs = 300

[[verify.harnesses.expected_artifacts]]
path = "artifacts/render-summary.json"
kind = "telemetry_summary"
label = "Render test conformance summary"

[[verify.harnesses.expected_artifacts]]
path = "artifacts/camera-tile-lifecycle.json"
kind = "telemetry_summary"
label = "Per-fixture camera and tile lifecycle telemetry"

[[verify.harnesses.expected_artifacts]]
path = "artifacts/render/basic-v9__z0-actual.png"
kind = "screenshot"
label = "Rendered basic-v9/z0 actual frame"

[[verify.harnesses.expected_artifacts]]
path = "artifacts/render/basic-v9__z0-diff.png"
kind = "pixel_diff"
label = "Rendered basic-v9/z0 golden pixel diff"

[[verify.harnesses.expected_artifacts]]
path = "artifacts/render/projection-globe__fill-planet-tiles-actual.png"
kind = "screenshot"
label = "Rendered projection-globe/fill-planet-tiles actual frame"

[[verify.harnesses.expected_artifacts]]
path = "artifacts/render/projection-globe__fill-planet-tiles-diff.png"
kind = "pixel_diff"
label = "Rendered projection-globe/fill-planet-tiles golden pixel diff"

[[verify.harnesses.expected_artifacts]]
path = "artifacts/render/terrain__default-actual.png"
kind = "screenshot"
label = "Rendered terrain/default actual frame"

[[verify.harnesses.expected_artifacts]]
path = "artifacts/render/terrain__default-diff.png"
kind = "pixel_diff"
label = "Rendered terrain/default golden pixel diff"
