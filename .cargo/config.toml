[target.wasm32-unknown-unknown]
rustflags = [
    # Enabled unstable APIs from web_sys
    "--cfg=web_sys_unstable_apis",
    "-C", "link-args=--import-memory",
]
runner = 'wasm-bindgen-test-runner'

[profile.wasm-dev]
inherits = "dev"
opt-level = 's'
debug = true
debug-assertions = true
overflow-checks = true
panic = 'abort'

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
strip = false
panic = 'abort'

[profile.wasm-worker-release]
inherits = "wasm-release"
opt-level = 2

[profile.wasm-mt-release]
inherits = "wasm-release"

[profile.wasm-mt-release.package.maplibre]
opt-level = "s"

[profile.wasm-mt-release.package.geozero]
opt-level = 2

[profile.wasm-mt-release.package.prost]
opt-level = 2

[profile.wasm-mt-release.package.lyon_tessellation]
opt-level = 2

[profile.wasm-mt-release.package.lyon_path]
opt-level = 2

[profile.wasm-mt-release.package.lyon_geom]
opt-level = 2

[profile.wasm-mt-release.package.zlib-rs]
opt-level = 2

[profile.wasm-mt-release.package.flate2]
opt-level = 2

[profile.wasm-mt-release.package.png]
opt-level = 2

[profile.wasm-mt-release.package.earcut]
opt-level = 2

[profile.wasm-mt-release.package.rustc-hash]
opt-level = 2

[profile.wasm-release.package.maplibre]
opt-level = "s"

[profile.wasm-release.package.earcut]
opt-level = 2

[profile.wasm-release.package.rustc-hash]
opt-level = 2
