name: Source limits
on:
  pull_request:
# A newer push to a pull request supersedes the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  file-length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's merge commit and its base, the first parent.
          fetch-depth: 2
      - run: node --test scripts/check-file-length.test.mjs
      - run: node scripts/check-file-length.mjs HEAD^1
  panic-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test scripts/check-panics.test.mjs
      - run: node scripts/check-panics.mjs
  module-and-stability-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 scripts/check-module-layout.py --base HEAD^1
      - run: python3 -m unittest scripts/check-immersive-stability.test.py
      - run: python3 scripts/check-immersive-stability.py --self-test
      - run: python3 -m unittest scripts/check-release-version.test.py
      - run: python3 scripts/check-release-version.py
  wasm-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust with wasm32 target
        uses: ./.github/actions/setup
        with:
          targets: wasm32-unknown-unknown
      - run: python3 -m unittest scripts/check-wasm-deps.test.py
      - run: python3 scripts/check-wasm-deps.py
