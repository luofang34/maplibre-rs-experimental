name: Source limits
on:
  pull_request:
# A newer push to a pull request supersedes the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's merge commit and its base, the first parent.
          fetch-depth: 2
      - name: Setup Rust with wasm32 target
        uses: ./.github/actions/setup
        with:
          targets: wasm32-unknown-unknown
      - name: Install cargo-evidence
        uses: ./.github/actions/cargo-install
        with:
          name: cargo-evidence@0.2.0
      - run: cargo evidence gate --format=jsonl --base HEAD^1
  module-and-stability-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 -m unittest scripts/check-immersive-stability.test.py
      - run: python3 scripts/check-immersive-stability.py --self-test
      - run: python3 -m unittest scripts/check-release-version.test.py
      - run: python3 scripts/check-release-version.py
      - run: node --test scripts/verify-phase.test.mjs scripts/check-wasm-size.test.mjs scripts/browser-visual-diff.test.mjs
