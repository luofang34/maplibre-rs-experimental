name: Run tests

on:
  workflow_call:

jobs:
  run-tests:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Setup
        uses: ./.github/actions/setup
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Dependencies
        uses: ./.github/actions/install-system-dependencies
      - name: Install GPU Drivers
        uses: ./.github/actions/install-driver
      - name: Test Vulkan
        shell: bash
        # One test at a time: lavapipe crashes now and then when tests create devices on
        # several threads at once.
        run: |
          RUST_TEST_THREADS=1 WGPU_BACKEND=vulkan just test maplibre x86_64-unknown-linux-gnu
      - name: Test EGL
        shell: bash
        # One test at a time: Mesa's GL crashes when tests create contexts on several
        # threads at once.
        run: |
          RUST_TEST_THREADS=1 EGL_LOG_LEVEL=debug WGPU_BACKEND=gl just test maplibre x86_64-unknown-linux-gnu
