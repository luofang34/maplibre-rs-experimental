name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify Release Version Parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test version parity script
        shell: bash
        run: python3 -m unittest scripts/check-release-version.test.py
      - name: Check workspace, web, and git tag versions
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            python3 scripts/check-release-version.py --tag "$REF_NAME"
          else
            python3 scripts/check-release-version.py
          fi

  build-linux:
    name: Build Linux Release Binary
    needs: verify-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Dependencies
        uses: ./.github/actions/install-system-dependencies
      - name: Build maplibre-demo (Linux x86_64)
        shell: bash
        run: |
          cargo build -p maplibre-demo --release --target x86_64-unknown-linux-gnu
          mkdir -p dist
          tar -czf dist/maplibre-demo-linux-x86_64.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release maplibre-demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          path: dist/maplibre-demo-linux-x86_64.tar.gz

  build-macos:
    name: Build macOS Release Binary
    needs: verify-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          targets: aarch64-apple-darwin
      - name: Install Dependencies
        uses: ./.github/actions/install-system-dependencies
      - name: Build maplibre-demo (macOS arm64)
        shell: bash
        run: |
          cargo build -p maplibre-demo --release --target aarch64-apple-darwin
          mkdir -p dist
          tar -czf dist/maplibre-demo-macos-arm64.tar.gz \
            -C target/aarch64-apple-darwin/release maplibre-demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-arm64
          path: dist/maplibre-demo-macos-arm64.tar.gz

  build-web:
    name: Build Web Wasm Package
    needs: verify-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          nightly: true
          targets: wasm32-unknown-unknown
      - name: Install Dependencies
        uses: ./.github/actions/install-system-dependencies
      - name: Install flatbuffers
        uses: ./.github/actions/install-flatbuffers
      - name: Install wasm-bindgen
        uses: ./.github/actions/cargo-install
        with:
          name: wasm-bindgen-cli@0.2.130
      - name: Build Web Wasm bundle
        shell: bash
        run: |
          just web-lib build --release --webgl
          mkdir -p dist
          tar -czf dist/maplibre-web-wasm.tar.gz -C web/lib dist package.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web-wasm
          path: dist/maplibre-web-wasm.tar.gz

  build-visionos:
    name: Build visionOS Staticlib & Header Bundle
    needs: verify-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned nightly with rust-src
        shell: bash
        run: |
          TOOLCHAIN="$(python3 -c 'import tomllib; print(tomllib.loads(open("apple/visionos/rust-toolchain.toml").read())["toolchain"]["channel"])')"
          rustup toolchain install "$TOOLCHAIN" --component rust-src --no-self-update
          echo "VISIONOS_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apple/visionos
      - name: Build device and simulator staticlibs
        shell: bash
        run: |
          cargo +"$VISIONOS_TOOLCHAIN" build --manifest-path apple/visionos/Cargo.toml \
            -Z build-std=std,panic_abort --release --target aarch64-apple-visionos
          cargo +"$VISIONOS_TOOLCHAIN" build --manifest-path apple/visionos/Cargo.toml \
            -Z build-std=std,panic_abort --release --target aarch64-apple-visionos-sim
          mkdir -p stage/visionos/device stage/visionos/simulator dist
          cp apple/visionos/maplibre_visionos.h stage/visionos/
          cp apple/visionos/target/aarch64-apple-visionos/release/libmaplibre_visionos.a stage/visionos/device/
          cp apple/visionos/target/aarch64-apple-visionos-sim/release/libmaplibre_visionos.a stage/visionos/simulator/
          tar -czf dist/maplibre-visionos-apple.tar.gz -C stage visionos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-visionos-apple
          path: dist/maplibre-visionos-apple.tar.gz

  github-release:
    name: Create GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - verify-version
      - build-linux
      - build-macos
      - build-web
      - build-visionos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.tar.gz --clobber
          else
            gh release create "$TAG" release-assets/*.tar.gz --title "$TAG" --generate-notes
          fi

  publish-crates:
    name: Publish Crates (crates.io)
    needs:
      - verify-version
      - build-linux
      - build-macos
      - build-web
      - build-visionos
    runs-on: ubuntu-24.04
    env:
      HAS_CRATES_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install Dependencies
        uses: ./.github/actions/install-system-dependencies
      - name: Dry-run package verification
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || env.HAS_CRATES_TOKEN != 'true' }}
        shell: bash
        run: cargo publish -p maplibre-build-tools --dry-run
      - name: Publish crates in dependency order
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_CRATES_TOKEN == 'true' }}
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p maplibre-build-tools
          cargo publish -p maplibre
          cargo publish -p maplibre-winit
