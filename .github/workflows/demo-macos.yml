name: Build demo for macOS

on:
  workflow_call:

jobs:
  demo-macos:
    name: Build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          targets: x86_64-apple-darwin
      - name: Install Dependencies
        uses: ./.github/actions/install-system-dependencies
      - name: Build
        shell: bash
        run: cd apple/xcode && xcodebuild -scheme "example (macOS)" build CODE_SIGNING_ALLOWED=NO MACOSX_DEPLOYMENT_TARGET=13.0 -derivedDataPath build
      - name: Check x86_64 darwin
        shell: bash
        run: just check maplibre-demo x86_64-apple-darwin
      - name: Test x86_64 darwin (Metal Shader & Debug Validation)
        shell: bash
        env:
          MTL_SHADER_VALIDATION: "1"
          MTL_DEBUG_LAYER: "1"
        run: just test maplibre-demo x86_64-apple-darwin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maplibre-x86_64-apple-darwin-demo
          path: apple/xcode/build/Build/Products/Debug/*.app
          if-no-files-found: error
