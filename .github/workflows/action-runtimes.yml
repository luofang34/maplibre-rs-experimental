name: Action runtimes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - run: node --test scripts/check-actions.test.mjs
      - run: node scripts/check-actions.mjs
