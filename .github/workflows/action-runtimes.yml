name: Action runtimes
on:
  pull_request:
  push:
    branches: [main]
# A newer push to a pull request or to main supersedes the run before it: merging a stack
# pushes main once per pull request and rebases each one left.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - run: node --test scripts/check-actions.test.mjs
      - run: node scripts/check-actions.mjs
