name: Build documentation

on:
  workflow_call:
    inputs:
      deploy:
        required: true
        type: boolean


jobs:
  build-docs:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install mdbook
        uses: ./.github/actions/cargo-install
        with:
          name: mdbook
      - name: Install Dependencies
        uses: ./.github/actions/install-system-dependencies
      - name: Build
        working-directory: docs
        shell: bash
        run: |
          ./generate-summary.sh
          mdbook build
      # The public API, as a host reads it, with and without the headless map.
      - name: API documentation lints
        shell: bash
        env:
          RUSTDOCFLAGS: -D missing_docs -D rustdoc::broken_intra_doc_links
        run: |
          cargo doc -p maplibre --no-deps --lib
          cargo doc -p maplibre --no-deps --lib --features headless,thread-safe-futures
      - name: API Documentation
        shell: bash
        run: cargo doc -p maplibre --no-deps --lib --document-private-items
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-docs
          path: target/doc/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book
          path: docs/book/
  deploy-docs:
    needs: build-docs
    if: inputs.deploy
    name: Deploy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download api-docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-docs
          path: artifacts/api
      - name: Download book
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: book
          path: artifacts/book
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: artifacts
          target-folder: docs
