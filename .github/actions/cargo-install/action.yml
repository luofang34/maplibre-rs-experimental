name: cargo-install
description: Install a dependency from cargo

inputs:
  name:
    required: true
    description: Name of the dependency

runs:
  using: "composite"
  steps:
    - name:  Install binstall
      run: |
        if command -v cargo-binstall &> /dev/null; then
          echo "binstall already found at $(command -v cargo-binstall)"
          exit 0
        fi
        
        FILE=""
        
        if [ "$RUNNER_OS" == "Linux" ]; then
          FILE="cargo-binstall-x86_64-unknown-linux-gnu.tgz"
        elif [ "$RUNNER_OS" == "Windows" ]; then
          FILE="cargo-binstall-x86_64-pc-windows-msvc.zip"
        elif [ "$RUNNER_OS" == "macOS" ]; then
          if [ "$RUNNER_ARCH" == "ARM64" ]; then
            FILE="cargo-binstall-aarch64-apple-darwin.zip"
          elif [ "$RUNNER_ARCH" == "X64" ]; then
            FILE="cargo-binstall-x86_64-apple-darwin.zip"
          else
            echo "Unable to install on arch: $RUNNER_ARCH"
            exit 1
          fi
        else
          # Install with debug profile -> faster compilation
          cargo install --debug --locked cargo-binstall@1.24.0
        fi
        
        if [ "$FILE" != "" ]; then
          # A pinned release from GitHub, unpacked onto the PATH: binstall upgrading itself
          # asks the crates.io API on every run, which refuses busy CI with HTTP 403.
          URL="https://github.com/cargo-bins/cargo-binstall/releases/download/v1.24.0/$FILE"
          echo "Downloading binstall: $URL"
          curl --fail -L -o /tmp/binstall.bin "$URL"
          # Next to the cargo on the PATH: under Windows bash, $HOME is the shell's own home,
          # not the one rustup installed into.
          INSTALL_PATH="$(dirname "$(command -v cargo)")"
          mkdir -p "$INSTALL_PATH"
          if [[ $FILE == *"zip"* ]]; then
            unzip -o /tmp/binstall.bin -d "$INSTALL_PATH"
          elif [[ $FILE == *"tgz"* ]]; then
            tar xf /tmp/binstall.bin -C "$INSTALL_PATH"
          else
            echo "Unknown format: $FILE"
            exit 1
          fi
        else
          echo "Skipping binary install"
        fi
        cargo binstall -V
      shell: bash
    - name: Install ${{ inputs.name }}
      shell: bash
      # Do not use symlinks because they behave weird on Windows(+Bash)
      run: cargo binstall --no-confirm --force --no-symlinks ${{ inputs.name }}
