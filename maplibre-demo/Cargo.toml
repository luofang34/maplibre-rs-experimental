[package]
name = "maplibre-demo"
version = "0.1.0"
description = "Demo of maplibre-re"
readme = "../README.md"

edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
web-webgl = ["maplibre/web-webgl"]
trace = ["maplibre/trace"]
headless = ["maplibre/headless", "dep:cgmath", "dep:png", "dep:tokio"]

[dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter"] }
maplibre = { path = "../maplibre", version = "0.1.0", features = ["thread-safe-futures"]  }
maplibre-winit = { path = "../maplibre-winit", version = "0.1.0"  }
tile-grid.workspace = true
clap.workspace = true
serde_json.workspace = true
cgmath = { workspace = true, optional = true }
png = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }

