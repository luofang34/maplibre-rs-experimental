[package]
name = "maplibre-roadshield"
description = "Road shields for maplibre-rs labels, made on request by the roadshield engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
maplibre = { path = "../maplibre" }
roadshield = "0.1.0"
resvg = { version = "0.48", default-features = false }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
geozero.workspace = true
image = { workspace = true, features = ["png"] }
maplibre = { path = "../maplibre", features = ["headless", "thread-safe-futures"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
wgpu.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
