[package]
name = "maplibre-visionos"
version = "0.1.0"
edition = "2021"
publish = false
description = "C ABI of the maplibre-rs renderer for the visionOS host app"

[lib]
crate-type = ["staticlib"]

[dependencies]
maplibre = { path = "../../maplibre", default-features = false, features = ["raster", "headless", "thread-safe-futures"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
wgpu = "30.0.1"
wgpu-hal = { version = "30.0.1", features = ["metal"] }
objc2 = "0.6.3"
objc2-metal = "0.3.2"
cgmath = "0.18"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace]
