[workspace]
resolver = "3"
members = ["hmd-set", "bridge"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
indicate-alerts = { git = "https://github.com/luofang34/Indicate.git", rev = "9b2c2b895e2fe3ac061b4aeeb809b7a9d7bdf15f" }
indicate-instrument-descriptor = { git = "https://github.com/luofang34/Indicate.git", rev = "9b2c2b895e2fe3ac061b4aeeb809b7a9d7bdf15f" }
indicate-instrument-scene = { git = "https://github.com/luofang34/Indicate.git", rev = "9b2c2b895e2fe3ac061b4aeeb809b7a9d7bdf15f" }
indicate-instrument-state = { git = "https://github.com/luofang34/Indicate.git", rev = "9b2c2b895e2fe3ac061b4aeeb809b7a9d7bdf15f" }
indicate-instrument-symbology = { git = "https://github.com/luofang34/Indicate.git", rev = "9b2c2b895e2fe3ac061b4aeeb809b7a9d7bdf15f" }
indicate-instrument-glyphs = { git = "https://github.com/luofang34/Indicate.git", rev = "9b2c2b895e2fe3ac061b4aeeb809b7a9d7bdf15f" }
indicate-instrument-conformance = { git = "https://github.com/luofang34/Indicate.git", rev = "9b2c2b895e2fe3ac061b4aeeb809b7a9d7bdf15f" }
indicate-instrument-registry = { git = "https://github.com/luofang34/Indicate.git", rev = "9b2c2b895e2fe3ac061b4aeeb809b7a9d7bdf15f" }
libm = "0.2.16"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
too_many_lines = "deny"

[profile.release]
lto = true
codegen-units = 1

[workspace.metadata.indicate-hmd]
repository = "https://github.com/luofang34/Indicate"
revision = "6bbb17083de1d76191d6b452ee00cc462a2e9c38"
