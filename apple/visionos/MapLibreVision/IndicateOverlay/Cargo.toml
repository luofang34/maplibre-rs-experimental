[workspace]
resolver = "3"
members = ["bridge"]
exclude = ["vendor/indicate"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
indicate-alerts = { path = "vendor/indicate/crates/indicate-alerts" }
indicate-instrument-descriptor = { path = "vendor/indicate/crates/indicate-instrument-descriptor" }
indicate-instrument-scene = { path = "vendor/indicate/crates/indicate-instrument-scene" }
indicate-instrument-state = { path = "vendor/indicate/crates/indicate-instrument-state" }
indicate-instrument-symbology = { path = "vendor/indicate/crates/indicate-instrument-symbology" }
indicate-instrument-glyphs = { path = "vendor/indicate/crates/indicate-instrument-glyphs" }
indicate-instrument-conformance = { path = "vendor/indicate/crates/indicate-instrument-conformance" }
indicate-instrument-registry = { path = "vendor/indicate/crates/indicate-instrument-registry" }
libm = "0.2.16"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
too_many_lines = "deny"

[profile.release]
lto = true
codegen-units = 1

[workspace.metadata.indicate-hmd]
repository = "https://github.com/luofang34/Indicate"
snapshot = "vendor/indicate/SOURCE.json"
